<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>لا يوجد اتصال بالإنترنت — Duck Entertainment</title>
<style>
  :root {
    color-scheme: light;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #121528;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .card img {
    width: 140px;
    height: auto;
    margin: 0 auto 24px;
    display: block;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 8px;
  }
  p {
    margin: 0 0 4px;
    color: #4a4a4a;
    font-size: 0.95rem;
  }
  .en {
    direction: ltr;
    font-size: 0.85rem;
    color: #7a7a7a;
    margin-top: 4px;
  }
  button {
    margin-top: 24px;
    background: #f5e847;
    color: #121528;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover {
    background: #e6da3f;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/logo-transparent.png" alt="Duck Entertainment" />
    <h1>لا يوجد اتصال بالإنترنت</h1>

    <p class="en">You're offline. Please check your connection and try again.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
